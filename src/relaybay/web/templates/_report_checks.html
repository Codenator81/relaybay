{#- The rules warning of an M or L report without a `verified: <where>` mark. The marks
    themselves stay in the report's text and are not listed again (backlog #100).
    Expects: checks (its marks), warning (the warning, or None). -#}
{% if not checks and warning %}
<p class="form-warning report-marks-warning" role="status">{{ warning }}</p>
{% endif %}
