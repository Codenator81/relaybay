{#- Settings sub-navigation. Expects: tab. -#}

  <a class="action{% if tab == 'policy' %} is-active{% endif %}" href="/settings/policy"{% if tab == 'policy' %} aria-current="true"{% endif %}>Policy</a>
  <a class="action{% if tab == 'rules' %} is-active{% endif %}" href="/settings/rules"{% if tab == 'rules' %} aria-current="true"{% endif %}>Rules</a>
  <a class="action{% if tab == 'notifications' %} is-active{% endif %}" href="/settings/notifications"{% if tab == 'notifications' %} aria-current="true"{% endif %}>Notifications</a>
</nav>
