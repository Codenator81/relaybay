site_name: relaybay
site_description: A live board and MCP server for coordinating many Claude Code sessions across projects.
site_url: https://codenator81.github.io/relaybay/
repo_url: https://github.com/Codenator81/relaybay
repo_name: Codenator81/relaybay
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Diataxis: tutorials, how-to guides, reference, explanation.
nav:
  - Home: index.md
  - Getting started:
      - Install and run: getting-started/install.md
      - Install with your coding agent: getting-started/agent-install.md
      - Connect Claude Code: connect-claude-code.md
  - How-to guides:
      - Coordinate many projects: how-to/coordinator.md
      - Import and export markdown: how-to/markdown-import-export.md
      - Intake from chats and e-mail: how-to/intake.md
      - Phone and LAN access: how-to/lan-access.md
      - Screenshots for review: how-to/screenshots-for-review.md
      - Troubleshooting: how-to/troubleshooting.md
      - Full access on a trusted machine: how-to/trusted-machine.md
      - Remove the integration: how-to/uninstall.md
  - Reference:
      - Specification: SPEC.md
      - MCP tools guide: mcp-tools.md
      - MCP reference: reference/mcp.md
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Policy: reference/policy.md
      - Roadmap: ROADMAP.md
      - Changelog: changelog.md
  - Explanation:
      - Architecture: architecture.md
      - Design documents:
          - design/index.md
          - Hooks and setup: design/0001-hooks-and-setup.md
          - Working rules: design/0002-working-rules.md
          - Packaging and release: design/0003-packaging-and-release.md
          - Navigation: design/0004-navigation.md
          - Comments to agents: design/0005-comments-to-agents.md
          - Environments and access: design/0006-environments-and-access.md
          - Review: design/0007-review.md
          - Memory and context: design/0008-memory-and-context.md
          - Screenshot annotations: design/0009-screenshot-annotations.md
          - Map and Usage: design/0010-map-and-usage.md
          - Documents in the database: design/0011-docs-in-database.md
          - Runner and embedded terminal: design/0012-runner-and-embedded-terminal.md
          - Policy as data: design/0013-policy-as-data.md
          - Task plan: design/0014-task-plan.md
          - Intake and autonomy: design/0015-intake-and-autonomy.md
      - Decisions (ADR):
          - HTMX + SSE front-end: adr/0001-htmx-sse.md
      - Former plan: PLAN.md
