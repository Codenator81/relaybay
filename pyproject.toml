[project]
name = "relaybay"
version = "0.8.4"
description = "A live board and MCP server for coordinating many Claude Code sessions across projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksandrs Poltarjonoks" }]
requires-python = ">=3.12"
keywords = [
    "claude-code",
    "mcp",
    "mcp-server",
    "agents",
    "ai-agents",
    "kanban",
    "task-board",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: GTK",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "jsonschema>=4.20",
    "markdown-it-py>=3.0",
    "mcp>=2,<3",
    "platformdirs>=4.2",
    "python-multipart>=0.0.9",
    "regex>=2024.11.6",
    "snowballstemmer>=2.2",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Codenator81/relaybay"
Documentation = "https://codenator81.github.io/relaybay/"
Changelog = "https://github.com/Codenator81/relaybay/blob/main/CHANGELOG.md"
Issues = "https://github.com/Codenator81/relaybay/issues"

[project.optional-dependencies]
# The desktop program (`relaybay desktop`). pystray is LGPL-3.0: it stays in this extra, out of
# the base install, the wheel's required dependencies and the Docker image.
desktop = [
    "pillow>=13.0,<14",
    "pystray>=0.19.5,<0.20",
    "pywebview>=6.2.1,<7",
]

[project.scripts]
relaybay = "relaybay.cli:main"
relaybay-hook = "relaybay.hook_client:main"

[project.gui-scripts]
relaybay-desktop = "relaybay.desktop.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
]
# Frozen builds of the desktop program (packaging/relaybay.spec); pinned so CI builds are repeatable.
build = [
    "pyinstaller==6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relaybay"]

[tool.hatch.build.targets.sdist]
include = [
    "src/relaybay",
    "tests",
    "docs",
    "scripts",
    "packaging",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRD_PARTY_LICENSES.txt",
    "mkdocs.yml",
]
exclude = ["docs/assets/*.gif"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
