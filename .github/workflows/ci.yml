name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  build:
    name: Build and check the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv run --no-project python scripts/check_dist.py
      - name: The wheel runs in a clean environment
        run: |
          uvx --isolated --from dist/*.whl relaybay --version
          uvx --isolated --from dist/*.whl relaybay demo --home "$RUNNER_TEMP/demo"
      - name: Smoke-start the server from the wheel
        run: |
          uvx --isolated --from dist/*.whl relaybay serve --home "$RUNNER_TEMP/smoke" --port 8799 &
          server=$!
          # Stop the server when the step ends, so it does not hold the uv cache lock.
          trap 'kill "$server" 2>/dev/null; wait "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8799/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/healthz
          curl -sf -o /dev/null -X POST http://127.0.0.1:8799/mcp \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/smoke/token")" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'

  reference:
    name: Generated reference is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/gen_reference.py --check

  changes:
    name: What the pull request changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        name: Files that go into the frozen builds
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/relaybay/desktop/|src/relaybay/hook_client\.py$|packaging/|pyproject\.toml$|uv\.lock$|THIRD_PARTY_LICENSES\.txt$|scripts/hook_timing\.py$|\.github/workflows/(desktop|ci)\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  # Not a required check: skipped on a pull request that touches nothing of the frozen builds;
  # always on main (release.yml builds the installers for a tag).
  desktop:
    name: Desktop builds
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
