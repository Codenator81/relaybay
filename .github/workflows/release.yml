name: Release

on:
  push:
    # Final releases only (v1.2.3); pre-release tags are not published.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - id: version
        name: Tag matches the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv run python scripts/gen_reference.py --check
      - run: uv build
      - run: uv run python scripts/check_dist.py --version "${{ steps.version.outputs.version }}"
      - name: The wheel runs in a clean environment
        run: |
          uvx --isolated --from dist/*.whl relaybay --version
          uvx --isolated --from dist/*.whl relaybay demo --home "$RUNNER_TEMP/demo"
      - name: CHANGELOG.md has notes for this version
        run: uv run python scripts/changelog_notes.py "${{ steps.version.outputs.version }}" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relaybay/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing; no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codenator81/relaybay:${{ needs.build.outputs.version }}
            ghcr.io/codenator81/relaybay:latest

  desktop:
    name: Desktop builds
    needs: build
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.build.outputs.version }}
      retention-days: 30

  github-release:
    name: GitHub Release
    # After the build and the installers, not after PyPI: the release exists even while PyPI
    # publishing is not set up yet.
    needs: [build, desktop]
    # A red macOS build never blocks the release; the Windows and Linux installers are checked below.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers/
          merge-multiple: true
      - name: Checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for required in "relaybay-$VERSION-windows-x64-setup.exe" "relaybay_${VERSION}_amd64.deb"; do
            test -f "installers/$required" || { echo "missing installer $required" >&2; exit 1; }
          done
          test -f "installers/relaybay-$VERSION-macos-arm64.dmg" || echo "::warning::no macOS dmg in this release"
          (cd dist && sha256sum -- *) > SHA256SUMS.txt
          (cd installers && sha256sum -- *) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/changelog_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* installers/* SHA256SUMS.txt \
            --title "relaybay $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  docs:
    name: Docs
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write  # required by actions/deploy-pages
    uses: ./.github/workflows/docs.yml
