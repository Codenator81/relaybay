name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Codenator81/relaybay/blob/main/docs/ROADMAP.md)
        first; it may already be planned. Open-ended ideas fit better in Discussions (Ideas).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: "What relaybay could do. Board, MCP tool, CLI or hook: say which part it touches."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
